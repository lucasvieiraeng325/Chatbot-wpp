<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14301F">
<title>Atendimento — Sítio Girassol</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mata:#14301F;        /* verde profundo do sítio */
  --mata-2:#1E4530;
  --folha:#3D7A52;
  --girassol:#E9A020;    /* só para atenção: não lidas, foco */
  --papel:#FBFAF6;
  --papel-2:#F1EFE7;
  --tinta:#12140F;
  --tinta-3:#6F7566;
  --linha:#E0DDD1;
  --alerta:#A8412A;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--papel);color:var(--tinta);
  font-size:15px;line-height:1.5;
  overscroll-behavior:none;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--girassol);outline-offset:2px}
.ic{width:22px;height:22px;display:block;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Login ---------- */
#login{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:var(--mata);padding:24px;
}
.caixa{width:100%;max-width:330px;text-align:center}
.marca{
  font-family:'Instrument Serif',Georgia,serif;font-size:40px;line-height:1.1;
  color:var(--papel);margin-bottom:6px;
}
.marca em{font-style:italic;color:var(--girassol)}
.sub{color:#8FA894;font-size:13px;margin-bottom:30px}
#senha{
  width:100%;padding:14px 16px;border-radius:var(--r);
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:var(--papel);text-align:center;letter-spacing:.12em;
}
#senha::placeholder{color:#6E8574;letter-spacing:normal}
#entrar{
  width:100%;margin-top:10px;padding:14px;border-radius:var(--r);
  background:var(--girassol);color:#2A1B00;font-weight:600;
}
#entrar:active{transform:scale(.98)}
#erroLogin{color:#E9927F;font-size:13px;margin-top:14px;min-height:18px}

/* ---------- Estrutura geral ---------- */
#app{display:none;flex-direction:column;height:100%}
#telas{flex:1;min-height:0}
.tela{display:none;height:100%}
.tela.ativa{display:flex;flex-direction:column}
@media(min-width:820px){
  #telaConversas.ativa{flex-direction:row}
  #lista{flex:0 0 340px;width:340px;border-right:1px solid var(--linha)}
  #conversa{flex:1}
  #voltar{display:none!important}
}

/* ---------- Abas ---------- */
#abas{
  display:flex;border-top:1px solid var(--linha);background:var(--papel);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.aba{
  flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:11px;color:var(--tinta-3);position:relative;
}
.aba.ativa{color:var(--mata);font-weight:600}
.aba .ic{width:23px;height:23px}
.pino{
  position:absolute;top:5px;left:50%;margin-left:6px;
  min-width:17px;height:17px;padding:0 5px;border-radius:100px;
  background:var(--girassol);color:#2A1B00;font-size:10.5px;font-weight:600;
  display:none;place-items:center;
}
.pino.on{display:grid}

/* ---------- Lista de conversas ---------- */
#lista{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;background:var(--papel)}
.topo{
  padding:14px 16px;border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding-top:max(14px,env(safe-area-inset-top));
}
.topo h1{
  font-family:'Instrument Serif',Georgia,serif;font-size:23px;font-weight:400;
}
.topo h1 em{font-style:italic;color:var(--folha)}
.pendentes{
  margin-left:auto;font-size:12px;color:var(--tinta-3);
  display:flex;align-items:center;gap:6px;
}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--folha)}
.ponto.off{background:var(--linha)}

#itens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{
  width:100%;text-align:left;padding:13px 16px;
  border-bottom:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start;
  position:relative;
}
.item:active,.item.sel{background:var(--papel-2)}
.item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;
}
.item.humano::before{background:var(--girassol)}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--mata);color:var(--papel);
  display:grid;place-items:center;font-size:14px;font-weight:600;
}
.item.humano .avatar{background:var(--folha)}
.corpo{flex:1;min-width:0}
.linha1{display:flex;align-items:baseline;gap:8px}
.nome{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quando{margin-left:auto;font-size:11px;color:var(--tinta-3);flex-shrink:0}
.previa{
  font-size:13px;color:var(--tinta-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{
  font-size:10.5px;padding:2px 7px;border-radius:100px;
  background:var(--papel-2);color:var(--folha);border:1px solid var(--linha);
  text-transform:lowercase;
}
.badge{
  min-width:19px;height:19px;padding:0 6px;border-radius:100px;
  background:var(--girassol);color:#2A1B00;
  font-size:11px;font-weight:600;display:grid;place-items:center;flex-shrink:0;
}

/* ---------- Conversa ---------- */
#conversa{display:none;flex-direction:column;flex:1 1 auto;min-height:0;background:var(--papel-2)}
#conversa.aberta{display:flex}
@media(max-width:819px){
  #conversa.aberta{position:fixed;inset:0;z-index:30}
  #lista.oculta{display:none}
}
.cabeca{
  padding:12px 14px;background:var(--papel);border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  padding-top:max(12px,env(safe-area-inset-top));
}
#voltar{font-size:21px;line-height:1;color:var(--folha);padding:2px 4px}
.quem{flex:1;min-width:0}
.quem b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem span{font-size:12px;color:var(--tinta-3)}
#agendarDaqui{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--linha);color:var(--folha);flex-shrink:0;
}
#alternar{
  font-size:12px;font-weight:500;padding:7px 13px;border-radius:100px;
  border:1px solid var(--linha);white-space:nowrap;
}
#alternar.ativo{background:var(--girassol);border-color:var(--girassol);color:#2A1B00}

#fluxo{flex:1;overflow-y:auto;padding:16px 14px;-webkit-overflow-scrolling:touch}
.bolha{
  max-width:78%;width:fit-content;min-width:82px;
  padding:8px 12px 6px;border-radius:16px;margin-bottom:8px;
  font-size:14.5px;word-wrap:break-word;white-space:pre-wrap;
}
.bolha.cliente{background:var(--papel);border:1px solid var(--linha);border-bottom-left-radius:5px}
.bolha.bot{background:var(--mata);color:var(--papel);margin-left:auto;border-bottom-right-radius:5px}
.bolha.atendente,.bolha.sistema{background:var(--folha);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bolha .meta{font-size:10px;opacity:.55;margin-top:3px;text-align:right}
.bolha a{color:inherit}
.midia{
  display:block;max-width:230px;max-height:290px;border-radius:11px;
  margin-top:3px;cursor:pointer;background:rgba(0,0,0,.05);
}
.audio{width:230px;max-width:100%;margin-top:4px;height:38px}
.anexo{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;
  padding:7px 11px;border-radius:9px;background:rgba(0,0,0,.07);margin-top:4px;
}
.bolha.bot .anexo,.bolha.atendente .anexo{background:rgba(255,255,255,.16)}
.dia{
  text-align:center;font-size:11px;color:var(--tinta-3);
  margin:14px 0 10px;text-transform:uppercase;letter-spacing:.07em;
}

/* ---------- Compositor ---------- */
.compor{
  padding:10px 12px;background:var(--papel);border-top:1px solid var(--linha);
  padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0;
}
.aviso{
  font-size:12px;color:var(--tinta-3);padding:9px 12px;text-align:center;
  background:var(--papel-2);border-radius:10px;
}
.aviso b{color:var(--folha)}
.campo{display:flex;gap:8px;align-items:flex-end}
#texto{
  flex:1;min-width:0;padding:10px 14px;border:1px solid var(--linha);border-radius:20px;
  background:var(--papel-2);resize:none;max-height:110px;font-size:15px;line-height:1.35;
}
#previa{
  display:none;padding:9px 11px;margin-bottom:9px;border-radius:11px;
  background:var(--papel-2);align-items:center;gap:10px;font-size:13px;
}
#previa img{width:42px;height:42px;object-fit:cover;border-radius:7px}
#previa .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tirarAnexo{color:var(--alerta);font-size:17px;padding:3px 6px}
#anexar,#gravar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;color:var(--folha);background:var(--papel-2);
  border:1px solid var(--linha);
}
#gravar.gravando{background:var(--alerta);color:#fff;border-color:var(--alerta);animation:pulsa 1.1s infinite}
@keyframes pulsa{50%{opacity:.55}}
#tempo{font-size:12.5px;color:var(--alerta);font-variant-numeric:tabular-nums;min-width:38px}
#enviar{
  width:42px;height:42px;border-radius:50%;background:var(--folha);color:#fff;
  display:grid;place-items:center;flex-shrink:0;font-size:17px;
}
#enviar:disabled{opacity:.4}
#erroEnvio{font-size:12px;color:var(--alerta);margin-top:7px;display:none}

/* ---------- Folha de anexos ---------- */
#folha{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(18,20,15,.42);align-items:flex-end;
}
#folha.on{display:flex}
.folhaCartao{
  width:100%;max-width:520px;margin:0 auto;background:var(--papel);
  border-radius:20px 20px 0 0;padding:14px 16px;
  padding-bottom:max(18px,env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto;
}
.puxador{width:38px;height:4px;border-radius:4px;background:var(--linha);margin:2px auto 12px}
.folhaCartao h3{font-size:14px;font-weight:600;margin-bottom:2px}
.folhaCartao p{font-size:12.5px;color:var(--tinta-3);margin-bottom:12px}
.grelha{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:379px){.grelha{grid-template-columns:repeat(3,1fr)}}
.atalho{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 5px 10px;border-radius:14px;background:var(--papel-2);
  border:1px solid var(--linha);text-align:center;
}
.atalho:active{background:var(--linha)}
.atalho[disabled]{opacity:.5}
.atalho .bolota{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--papel);border:1px solid var(--linha);color:var(--folha);
}
.atalho .bolota .ic{width:25px;height:25px;stroke-width:1.5}
.atalho.dispositivo .bolota{background:var(--mata);color:var(--papel);border-color:var(--mata)}
.atalho .rot{font-size:11px;line-height:1.25;color:var(--tinta)}
#folhaErro{font-size:12.5px;color:var(--alerta);margin-top:10px;display:none}

/* ---------- Agenda ---------- */
#telaAgenda{background:var(--papel);min-height:0}
.agendaRolagem{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.botaoTopo{
  font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linha);white-space:nowrap;
}
#irHoje{margin-left:auto}
.botaoTopo.forte{background:var(--folha);border-color:var(--folha);color:#fff}
.faixaHoje{
  margin:12px 16px 0;padding:11px 13px;border-radius:12px;
  background:var(--papel-2);border:1px solid var(--linha);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.faixaHoje b{color:var(--mata)}
#reenviarAgenda{
  margin-left:auto;font-size:11.5px;padding:6px 11px;border-radius:100px;
  border:1px solid var(--linha);background:var(--papel);flex-shrink:0;color:var(--folha);
}
.mesNav{display:flex;align-items:center;gap:6px;padding:14px 16px 6px}
.mesNav b{
  flex:1;text-align:center;font-family:'Instrument Serif',Georgia,serif;
  font-size:20px;font-weight:400;
}
.mesNav b::first-letter{text-transform:uppercase}
.setinha{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--linha);color:var(--folha);font-size:17px;line-height:1}
.semanas,#grade{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px}
.semanas{font-size:10.5px;color:var(--tinta-3);text-align:center;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cel{
  aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:13.5px;
  background:transparent;color:var(--tinta);position:relative;
}
.cel.fora{color:#BFBFB2}
.cel.hoje{box-shadow:inset 0 0 0 1.5px var(--folha);font-weight:600}
.cel.sel{background:var(--mata);color:var(--papel)}
.cel.sel.hoje{box-shadow:inset 0 0 0 1.5px var(--girassol)}
.pts{display:flex;gap:2.5px;height:5px}
.pt{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
.pt.visita{background:var(--folha)}
.pt.evento{background:var(--girassol)}
.cel.sel .pt.visita{background:#9FD4B0}
.legendaCal{
  display:flex;gap:14px;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--tinta-3);padding:12px 0 4px;
}
.legendaCal span{display:flex;align-items:center;gap:5px}
.diaCabeca{
  display:flex;align-items:center;gap:10px;padding:10px 16px 6px;
  border-top:1px solid var(--linha);margin-top:6px;
}
.diaCabeca h2{font-size:14px;font-weight:600}
.diaCabeca h2::first-letter{text-transform:uppercase}
#addNoDia{margin-left:auto;font-size:12px;color:var(--folha);font-weight:500}
#diaLista{padding:4px 16px 0;display:flex;flex-direction:column;gap:9px}
.cartao{
  border:1px solid var(--linha);border-left:3px solid var(--folha);
  border-radius:12px;padding:11px 13px;background:var(--papel);
}
.cartao.evento{border-left-color:var(--girassol)}
.cartao.cancelado{opacity:.55}
.cartao.cancelado .tit{text-decoration:line-through}
.cartao .h{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.cartao .hora{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{
  font-size:10.5px;padding:2px 8px;border-radius:100px;
  background:var(--papel-2);border:1px solid var(--linha);color:var(--tinta-3);
}
.chip.visita{color:var(--folha)}
.chip.evento{color:#8A5E05;background:#FDF3DC;border-color:#EFDCA8}
.chip.pendente{color:var(--alerta)}
.cartao .tit{font-size:14.5px;font-weight:600}
.cartao .sub{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.cartao .sub a{color:var(--folha);text-decoration:none;font-weight:500}
.cartao .obs{
  font-size:12.5px;color:var(--tinta-3);margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--linha);white-space:pre-wrap;
}
.cartao .botoes{display:flex;gap:6px;margin-top:9px}
.mini{
  display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;
  border-radius:100px;border:1px solid var(--linha);color:var(--tinta-3);
}
.mini .ic{width:15px;height:15px}
.mini.perigo{color:var(--alerta)}

/* ---------- Modal do agendamento ---------- */
#modal{
  position:fixed;inset:0;z-index:70;display:none;
  background:rgba(18,20,15,.45);align-items:flex-end;
}
#modal.on{display:flex}
@media(min-width:600px){#modal{align-items:center}}
.modalCartao{
  width:100%;max-width:480px;margin:0 auto;background:var(--papel);
  border-radius:20px 20px 0 0;padding:16px 16px 18px;
  padding-bottom:max(18px,env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;
}
@media(min-width:600px){.modalCartao{border-radius:18px}}
.modalCartao h3{
  font-family:'Instrument Serif',Georgia,serif;font-size:22px;font-weight:400;
  margin-bottom:14px;
}
.linhaForm{display:flex;gap:10px}
.linhaForm > label{flex:1}
label.rot{display:block;margin-bottom:11px;font-size:12px;color:var(--tinta-3)}
label.rot input,label.rot textarea,label.rot select{
  width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--linha);background:var(--papel-2);font-size:15px;
}
label.rot textarea{resize:vertical;min-height:64px}
.segmentos{display:flex;gap:6px;margin-bottom:13px}
.seg{
  flex:1;padding:9px;border-radius:10px;border:1px solid var(--linha);
  background:var(--papel-2);font-size:13.5px;display:flex;
  align-items:center;justify-content:center;gap:6px;
}
.seg.on{background:var(--mata);border-color:var(--mata);color:var(--papel)}
.seg .ic{width:17px;height:17px}
.modalBotoes{display:flex;gap:8px;margin-top:6px;align-items:center}
#salvarAg{
  flex:1;padding:12px;border-radius:12px;background:var(--folha);color:#fff;
  font-weight:600;
}
#salvarAg:disabled{opacity:.5}
#cancelarAg{padding:12px 14px;border-radius:12px;border:1px solid var(--linha)}
#apagarAg{padding:12px;border-radius:12px;color:var(--alerta);border:1px solid var(--linha);display:none}
#erroAg{font-size:12.5px;color:var(--alerta);margin-top:9px;display:none}

/* ---------- Diversos ---------- */
.vazio{
  flex:1;display:grid;place-items:center;text-align:center;padding:40px 30px;
  color:var(--tinta-3);font-size:14px;
}
.vazio .flor{font-size:32px;display:block;margin-bottom:12px;opacity:.5}
.vazioMini{padding:22px 10px;text-align:center;color:var(--tinta-3);font-size:13px}
#faixaPush{
  display:none;padding:11px 14px;background:#FDF3DC;border-bottom:1px solid #EFDCA8;
  font-size:13px;align-items:center;gap:10px;
}
#faixaPush b{color:#7A5200;font-weight:600}
#ativarPush{
  margin-left:auto;padding:7px 13px;border-radius:100px;flex-shrink:0;
  background:var(--girassol);color:#2A1B00;font-weight:600;font-size:12px;
}
#fecharPush{padding:4px 6px;color:#A08A50;font-size:16px;line-height:1}
#torrada{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;
  background:var(--mata);color:var(--papel);padding:10px 16px;border-radius:100px;
  font-size:13px;display:none;max-width:88vw;text-align:center;
}
#torrada.on{display:block}
/* no computador o mês não pode virar um cartaz: tudo centralizado e com teto */
@media(min-width:820px){
  .faixaHoje,.mesNav,.semanas,#grade,.legendaCal,.diaCabeca,#diaLista{
    max-width:760px;margin-left:auto;margin-right:auto;
  }
  .cel{aspect-ratio:auto;min-height:62px}
}
</style>
</head>
<body>

<!-- ======== Ícones ======== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-chat" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12Z"/>
  </symbol>

<div id="torrada"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let atual = null, statusAtual = 'bot', timer = null, ultimoHash = '', ultimoFluxo = '';
const esc = t => (t||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sessão ---------- */
async function verificar(){
  const r = await fetch('/api/sessao').then(r=>r.json()).catch(()=>({}));
  if(r.autenticado){ abrirApp(); } else { $('#login').style.display='grid'; $('#senha').focus(); }
}
function abrirApp(){
  $('#login').style.display='none';
  $('#app').style.display='flex';
  carregarLista().then(() => {
    if(alvo){
      const b = $(`.item[data-tel="${alvo}"]`);
      if(b) abrir(alvo, b.dataset.nome);
      history.replaceState({}, '', '/painel');
    }
  });
  if(abaInicial === 'agenda') trocarAba('agenda');
  carregarAnexos();
  atualizarSino();
  prepararPush();
  timer = setInterval(atualizar, 5000);
  setInterval(atualizarSino, 60000);
}
$('#entrar').onclick = entrar;
$('#senha').onkeydown = e => { if(e.key==='Enter') entrar(); };
async function entrar(){
  const senha = $('#senha').value;
  if(!senha) return;
  $('#entrar').disabled = true;
  const r = await fetch('/api/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({senha})
  });
  $('#entrar').disabled = false;
  if(r.ok){ abrirApp(); }
  else { const d = await r.json().catch(()=>({})); $('#erroLogin').textContent = d.erro || 'Não foi possível entrar'; }
}

/* ---------- abas ---------- */
function trocarAba(nome){
  // no celular a conversa é uma camada por cima de tudo: precisa sair da frente
  if(nome !== 'conversas' && innerWidth < 820){
    $('#conversa').classList.remove('aberta');
    $('#lista').classList.remove('oculta');
  }
  $$('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === nome));
  $('#telaConversas').classList.toggle('ativa', nome === 'conversas');
  $('#telaAgenda').classList.toggle('ativa', nome === 'agenda');
  if(nome === 'agenda'){ carregarMes(); atualizarSino(); }
}
$$('.aba').forEach(b => b.onclick = () => trocarAba(b.dataset.aba));

function torrada(msg){
  const t = $('#torrada');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._id);
  t._id = setTimeout(() => t.classList.remove('on'), 3200);
}

/* ---------- utilidades ---------- */
const iniciais = n => (n||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase() || '?';
function quando(iso){
  const d = new Date(iso), agora = new Date();
  const dif = (agora - d)/1000;
  if(dif < 60) return 'agora';
  if(dif < 3600) return Math.floor(dif/60)+'min';
  if(d.toDateString() === agora.toDateString())
    return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const ontem = new Date(agora); ontem.setDate(agora.getDate()-1);
  if(d.toDateString() === ontem.toDateString()) return 'ontem';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}
const ROTULO = {casamento:'casamento',quinze:'15 anos',infantil:'infantil',
  confraternizacao:'aniversário',decorado:'espaço',localizacao:'local',regras:'informações'};
function corpoAnexo(m){
  if(!m.url) return '';
  const meta = m.url.startsWith('meta:');
  const src = meta ? '/api/midia/' + m.url.slice(5) : m.url;
  if(m.tipo === 'image')
    return `<img class="midia" src="${esc(src)}" alt="Imagem enviada" loading="lazy"
             onclick="window.open('${esc(src)}','_blank')">`;
  if(m.tipo === 'audio')
    return `<audio class="audio" controls preload="none" src="${esc(src)}"></audio>`;
  if(m.tipo === 'video')
    return `<video class="midia" controls preload="metadata" src="${esc(src)}"></video>`;
  return `<br><a class="anexo" href="${esc(src)}" target="_blank" rel="noopener">📄 abrir arquivo</a>`;
}

/* ---------- lista ---------- */
async function carregarLista(){
  const r = await fetch('/api/conversas');
  if(r.status === 401) return location.reload();
  const {conversas} = await r.json();

  const hash = JSON.stringify(conversas.map(c=>[c.telefone,c.nao_lidas,c.ultimo_contato,c.status]));
  if(hash === ultimoHash) return;
  ultimoHash = hash;

  const total = conversas.reduce((s,c)=>s+(c.nao_lidas||0),0);
  $('#contador').textContent = total ? `${total} não lida${total>1?'s':''}` : 'tudo em dia';
  $('#pulso').className = 'ponto' + (total ? '' : ' off');
  const pino = $('#pinoConversas');
  pino.textContent = total > 99 ? '99+' : total;
  pino.classList.toggle('on', total > 0);

  if(!conversas.length){
    $('#itens').innerHTML = '<div class="vazio"><span class="flor">🌻</span>Nenhuma conversa ainda.<br>Elas aparecem aqui assim que alguém escrever.</div>';
    return;
  }

  $('#itens').innerHTML = conversas.map(c => `
    <button class="item ${c.status==='humano'?'humano':''} ${c.telefone===atual?'sel':''}"
            data-tel="${c.telefone}" data-nome="${esc(c.nome||'')}">
      <div class="avatar">${iniciais(c.nome)}</div>
      <div class="corpo">
        <div class="linha1">
          <span class="nome">${esc(c.nome || '+'+c.telefone)}</span>
          <span class="quando">${quando(c.ultimo_contato)}</span>
        </div>
        <div class="previa">${esc((c.ultima||'').slice(0,64) || 'Sem mensagens')}</div>
        ${c.interesses?.length ? `<div class="tags">${c.interesses.slice(0,3)
          .map(i=>`<span class="tag">${ROTULO[i]||i}</span>`).join('')}</div>` : ''}
      </div>
      ${c.nao_lidas ? `<span class="badge">${c.nao_lidas}</span>` : ''}
    </button>`).join('');

  $('#itens').querySelectorAll('.item').forEach(b => {
    b.onclick = () => abrir(b.dataset.tel, b.dataset.nome);
  });
}

/* ---------- conversa ---------- */
async function abrir(tel, nome){
  trocarAba('conversas');
  atual = tel;
  ultimoFluxo = '';
  statusAtual = null;
  $('#quemNome').textContent = nome || '+'+tel;
  $('#quemTel').textContent = '+'+tel;
  $('#conversa').classList.add('aberta');
  if(innerWidth < 820) $('#lista').classList.add('oculta');
  await carregarMensagens(true);
  ultimoHash = '';
  carregarLista();
}
$('#voltar').onclick = () => {
  $('#conversa').classList.remove('aberta');
  $('#lista').classList.remove('oculta');
  atual = null;
};

async function carregarMensagens(rolar){
  if(!atual) return;
  const r = await fetch('/api/mensagens/'+atual);
  if(r.status === 401) return location.reload();
  const {mensagens, status} = await r.json();
  const mudouStatus = statusAtual !== status;
  statusAtual = status;

  $('#alternar').textContent = status==='humano' ? 'Devolver ao bot' : 'Assumir';
  $('#alternar').className = status==='humano' ? 'ativo' : '';
  if(mudouStatus || !$('#texto')) desenharCompositor();

  const assinatura = mensagens.length + ':' + (mensagens.at(-1)?.criado_em || '');
  if(assinatura === ultimoFluxo && !mudouStatus){
    if(rolar) $('#fluxo').scrollTop = $('#fluxo').scrollHeight;
    return;
  }
  ultimoFluxo = assinatura;

  let dia = '';
  $('#fluxo').innerHTML = mensagens.map(m => {
    const d = new Date(m.criado_em);
    const rotulo = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
    const cabeca = rotulo !== dia ? (dia = rotulo, `<div class="dia">${rotulo}</div>`) : '';
    const hora = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const quem = m.autor === 'cliente' ? 'cliente' : m.autor;
    const autor = m.autor === 'bot' ? 'bot' : m.autor === 'atendente' ? 'você' : '';
    const anexo = corpoAnexo(m);
    return `${cabeca}<div class="bolha ${quem}">${esc(m.conteudo)}${anexo}
      <div class="meta">${hora}${autor?' · '+autor:''}</div></div>`;
  }).join('') || '<div class="vazio">Sem mensagens nesta conversa.</div>';

  if(rolar) $('#fluxo').scrollTop = $('#fluxo').scrollHeight;
}

function desenharCompositor(){
  if(statusAtual !== 'humano'){
    $('#compor').innerHTML = `<div class="aviso">O bot está atendendo. Toque em <b>Assumir</b> para responder você.</div>`;
    return;
  }
  $('#compor').innerHTML = `
    <div id="previa"></div>
    <div class="campo">
      <button id="anexar" aria-label="Anexar arquivo"><svg class="ic"><use href="#ic-clipe"/></svg></button>
      <textarea id="texto" rows="1" placeholder="Escreva sua resposta"></textarea>
      <span id="tempo"></span>
      <button id="gravar" aria-label="Gravar áudio">🎙</button>
      <button id="enviar" aria-label="Enviar">↑</button>
    </div>
    <input type="file" id="arquivo" accept="image/*,audio/*,video/*,.pdf" hidden>
    <div id="erroEnvio"></div>`;
  const t = $('#texto');
  t.oninput = () => { t.style.height='auto'; t.style.height = Math.min(t.scrollHeight,110)+'px'; };
  t.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey && innerWidth>=820){ e.preventDefault(); mandar(); } };
  $('#enviar').onclick = mandar;
  $('#anexar').onclick = abrirFolha;
  $('#arquivo').onchange = e => escolherArquivo(e.target.files[0]);
  $('#gravar').onclick = alternarGravacao;
}

/* ---------- anexos rápidos ---------- */
let catalogo = [];

async function carregarAnexos(){
  try{
    const r = await fetch('/api/anexos');
    if(!r.ok) return;
    catalogo = (await r.json()).anexos || [];
  }catch(e){ catalogo = []; }
  desenharGrelha();
}

function desenharGrelha(){
  $('#grelhaAnexos').innerHTML = `
    <button class="atalho dispositivo" data-do="arquivo">
      <span class="bolota"><svg class="ic"><use href="#ic-clipe"/></svg></span>
      <span class="rot">Do aparelho</span>
    </button>` + catalogo.map(a => `
    <button class="atalho" data-chave="${esc(a.chave)}" title="${esc(a.resumo||'')}">
      <span class="bolota"><svg class="ic"><use href="#ic-${esc(a.icone)}"/></svg></span>
      <span class="rot">${esc(a.rotulo)}</span>
    </button>`).join('');

  $$('#grelhaAnexos .atalho').forEach(b => {
    b.onclick = () => b.dataset.do === 'arquivo'
      ? (fecharFolha(), $('#arquivo').click())
      : enviarAtalho(b);
  });
}

function abrirFolha(){ $('#folhaErro').style.display='none'; $('#folha').classList.add('on'); }
function fecharFolha(){ $('#folha').classList.remove('on'); }
$('#folha').onclick = e => { if(e.target.id === 'folha') fecharFolha(); };

async function enviarAtalho(botao){
  if(!atual) return;
  const chave = botao.dataset.chave;
  $$('#grelhaAnexos .atalho').forEach(b => b.disabled = true);
  botao.querySelector('.rot').textContent = 'enviando…';
  try{
    const r = await fetch('/api/anexos/enviar',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({telefone: atual, chave})
    });
    const d = await r.json().catch(()=>({}));
    if(r.ok){
      fecharFolha();
      torrada('Material enviado 🌻');
      await carregarMensagens(true);
    }else{
      $('#folhaErro').textContent = d.erro || 'Não foi possível enviar';
      $('#folhaErro').style.display = 'block';
    }
  }catch(e){
    $('#folhaErro').textContent = 'Sem conexão com o servidor';
    $('#folhaErro').style.display = 'block';
  }finally{
    $$('#grelhaAnexos .atalho').forEach(b => b.disabled = false);
    desenharGrelha();
  }
}

/* ---------- anexo do aparelho ---------- */
let anexo = null;

function escolherArquivo(f){
  if(!f) return;
  anexo = f;
  const p = $('#previa');
  const eImagem = f.type.startsWith('image/');
  p.innerHTML = `
    ${eImagem ? `<img src="${URL.createObjectURL(f)}" alt="">` : '<span style="font-size:22px">📎</span>'}
    <span class="nome">${esc(f.name)} · ${(f.size/1024/1024).toFixed(1)} MB</span>
    <button id="tirarAnexo" aria-label="Remover anexo">×</button>`;
  p.style.display = 'flex';
  $('#tirarAnexo').onclick = limparAnexo;
  $('#texto').placeholder = 'Legenda (opcional)';
}

function limparAnexo(){
  anexo = null;
  $('#previa').style.display = 'none';
  $('#arquivo').value = '';
  $('#texto').placeholder = 'Escreva sua resposta';
}

/* ---------- gravação de áudio ---------- */
let rec = null, pedacos = [], contagem = null, segundos = 0;

function melhorFormato(){
  for(const m of ['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/mp4','audio/webm'])
    if(window.MediaRecorder?.isTypeSupported(m)) return m;
  return '';
}

async function alternarGravacao(){
  if(rec && rec.state === 'recording'){ rec.stop(); return; }
  if(!navigator.mediaDevices?.getUserMedia){
    return falhaEnvio('Este navegador não grava áudio.');
  }
  try{
    const fluxo = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = melhorFormato();
    rec = new MediaRecorder(fluxo, mime ? {mimeType:mime} : {});
    pedacos = [];
    rec.ondataavailable = e => e.data.size && pedacos.push(e.data);
    rec.onstop = () => {
      fluxo.getTracks().forEach(t => t.stop());
      clearInterval(contagem);
      $('#gravar').classList.remove('gravando');
      $('#tempo').textContent = '';
      const tipo = rec.mimeType || 'audio/webm';
      const ext = tipo.includes('ogg') ? 'ogg' : tipo.includes('mp4') ? 'm4a' : 'webm';
      const blob = new Blob(pedacos, {type: tipo.split(';')[0]});
      if(blob.size < 1200) return;
      escolherArquivo(new File([blob], `audio-${Date.now()}.${ext}`, {type: blob.type}));
    };
    rec.start();
    segundos = 0;
    $('#gravar').classList.add('gravando');
    $('#tempo').textContent = '0:00';
    contagem = setInterval(() => {
      segundos++;
      $('#tempo').textContent = `${Math.floor(segundos/60)}:${String(segundos%60).padStart(2,'0')}`;
      if(segundos >= 120) rec.stop();
    }, 1000);
  }catch(e){
    falhaEnvio('Permita o acesso ao microfone para gravar áudio.');
  }
}

function falhaEnvio(msg){

async function mandarArquivo(legenda){

/* =====================================================
   AGENDA
   ===================================================== */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
               'agosto','setembro','outubro','novembro','dezembro'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hojeISO = () => iso(new Date());
const doISO = s => { const [a,m,d] = s.split('-').map(Number); return new Date(a, m-1, d); };

let mesRef = new Date(); mesRef.setDate(1); mesRef.setHours(0,0,0,0);
let diaSel = hojeISO();
let porDia = {};

function limitesDaGrade(){
  const ini = new Date(mesRef);
  ini.setDate(1 - ini.getDay());
  const fim = new Date(ini);
  fim.setDate(ini.getDate() + 41);
  return [ini, fim];
}

async function carregarMes(){
  const [ini, fim] = limitesDaGrade();
  try{
    const r = await fetch(`/api/agenda?inicio=${iso(ini)}&fim=${iso(fim)}`);
    if(r.status === 401) return location.reload();
    const {agendamentos} = await r.json();
    porDia = {};
    for(const a of agendamentos) (porDia[a.dia] ||= []).push(a);
  }catch(e){ porDia = {}; }
  desenharCalendario();
  desenharDia();
}

function desenharCalendario(){
  $('#mesRotulo').textContent = `${MESES[mesRef.getMonth()]} de ${mesRef.getFullYear()}`;
  const [ini] = limitesDaGrade();
  const hoje = hojeISO();
  let html = '';
  for(let i = 0; i < 42; i++){
    const d = new Date(ini); d.setDate(ini.getDate() + i);
    const chave = iso(d);
    const fora = d.getMonth() !== mesRef.getMonth();
    const itens = (porDia[chave] || []).filter(a => a.status !== 'cancelado');
    const tipos = [...new Set(itens.map(a => a.tipo))];
    const pts = tipos.map(t => `<i class="pt ${t}"></i>`).join('');
    html += `<button class="cel ${fora?'fora':''} ${chave===hoje?'hoje':''} ${chave===diaSel?'sel':''}"
              data-iso="${chave}"><span>${d.getDate()}</span><span class="pts">${pts}</span></button>`;
  }
  $('#grade').innerHTML = html;
  $$('#grade .cel').forEach(b => b.onclick = () => {
    diaSel = b.dataset.iso;
    const d = doISO(diaSel);
    if(d.getMonth() !== mesRef.getMonth()){
      mesRef = new Date(d.getFullYear(), d.getMonth(), 1);
      return carregarMes();
    }
    desenharCalendario(); desenharDia();
  });
}

function desenharDia(){
  const d = doISO(diaSel);
  $('#diaTitulo').textContent = d.toLocaleDateString('pt-BR',
    {weekday:'long', day:'2-digit', month:'long'});
  const itens = porDia[diaSel] || [];
  if(!itens.length){
    $('#diaLista').innerHTML = '<div class="vazioMini">Nada marcado neste dia.</div>';
    return;
  }
  $('#diaLista').innerHTML = itens.map(a => `
    <div class="cartao ${a.tipo} ${a.status}">
      <div class="h">
        <span class="hora">${a.hora || 'dia todo'}</span>
        <span class="chip ${a.tipo}">${a.tipo === 'evento' ? 'evento' : 'visita'}</span>
        ${a.status !== 'confirmado' ? `<span class="chip ${a.status}">${a.status}</span>` : ''}
      </div>
      <div class="tit">${esc(a.titulo)}</div>
      ${a.cliente || a.telefone ? `<div class="sub">${esc(a.cliente||'')}${
        a.telefone ? ` · <a href="#" data-conversa="${esc(a.telefone)}">abrir conversa</a>` : ''}</div>` : ''}
      ${a.observacoes ? `<div class="obs">${esc(a.observacoes)}</div>` : ''}
      <div class="botoes">
        <button class="mini" data-editar="${a.id}"><svg class="ic"><use href="#ic-lapis"/></svg>Editar</button>
        <button class="mini perigo" data-apagar="${a.id}"><svg class="ic"><use href="#ic-lixo"/></svg>Excluir</button>
      </div>
    </div>`).join('');

  $$('#diaLista [data-conversa]').forEach(a => a.onclick = e => {
    e.preventDefault(); abrir(a.dataset.conversa, '');
  });
  $$('#diaLista [data-editar]').forEach(b => b.onclick = () => {
    const item = itens.find(x => String(x.id) === b.dataset.editar);
    if(item) abrirModal(item);
  });
  $$('#diaLista [data-apagar]').forEach(b => b.onclick = () => apagar(b.dataset.apagar));
}

/* ---------- modal ---------- */
let editando = null, tipoSel = 'visita';

function abrirModal(item, dia, pre){
  editando = item ? item.id : null;
  tipoSel = item ? item.tipo : 'visita';
  $$('.seg').forEach(s => s.classList.toggle('on', s.dataset.tipo === tipoSel));
  $('#tituloModal').textContent = item ? 'Editar agendamento' : 'Novo agendamento';
  $('#fTitulo').value   = item?.titulo || '';
  $('#fDia').value      = item?.dia || dia || hojeISO();
  $('#fHora').value     = item?.hora || '';
  $('#fCliente').value  = item?.cliente || pre?.cliente || '';
  $('#fTelefone').value = item?.telefone || pre?.telefone || '';
  $('#fStatus').value   = item?.status || 'confirmado';
  $('#fObs').value      = item?.observacoes || '';
  $('#apagarAg').style.display = item ? 'block' : 'none';
  $('#erroAg').style.display = 'none';
  $('#modal').classList.add('on');
  setTimeout(() => $('#fTitulo').focus(), 80);
}
function fecharModal(){ $('#modal').classList.remove('on'); editando = null; }
$('#cancelarAg').onclick = fecharModal;
$('#modal').onclick = e => { if(e.target.id === 'modal') fecharModal(); };
$$('.seg').forEach(s => s.onclick = () => {

});

$('#salvarAg').onclick = async () => {
  const corpo = {
    tipo: tipoSel,
    titulo: $('#fTitulo').value.trim(),
    dia: $('#fDia').value,
    hora: $('#fHora').value || null,
    cliente: $('#fCliente').value.trim(),
    telefone: $('#fTelefone').value.replace(/\D/g,''),
    status: $('#fStatus').value,
    observacoes: $('#fObs').value.trim(),
  };
  if(!corpo.dia) return erroAg('Escolha a data.');
  if(!corpo.titulo && !corpo.cliente) return erroAg('Dê um título ou informe o cliente.');
  if(!corpo.titulo)
    corpo.titulo = (tipoSel === 'evento' ? 'Evento — ' : 'Visita — ') + corpo.cliente;

  $('#salvarAg').disabled = true;
  try{
    const r = await fetch(editando ? '/api/agenda/'+editando : '/api/agenda', {
      method: editando ? 'PUT' : 'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(corpo)
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) return erroAg(d.erro || d.detail || 'Não foi possível salvar');
    diaSel = corpo.dia;
    const dt = doISO(diaSel);
    if(dt.getMonth() !== mesRef.getMonth() || dt.getFullYear() !== mesRef.getFullYear())
      mesRef = new Date(dt.getFullYear(), dt.getMonth(), 1);
    fecharModal();
    await carregarMes();
    atualizarSino();
    torrada(editando ? 'Agendamento atualizado' : 'Agendamento criado 🌻');
  }catch(e){ erroAg('Sem conexão com o servidor'); }
  finally{ $('#salvarAg').disabled = false; }
};

function erroAg(msg){
  $('#erroAg').textContent = msg;
  $('#erroAg').style.display = 'block';
}

$('#apagarAg').onclick = () => { if(editando) apagar(editando, true); };

async function apagar(id, doModal){
  if(!confirm('Excluir este agendamento?')) return;
  const r = await fetch('/api/agenda/'+id, {method:'DELETE'});
  if(!r.ok) return doModal ? erroAg('Não foi possível excluir') : torrada('Não foi possível excluir');
  if(doModal) fecharModal();
  await carregarMes();
  atualizarSino();
  torrada('Agendamento excluído');
}

/* ---------- notificações ---------- */
let swReg = null;

async function prepararPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    swReg = await navigator.serviceWorker.register('/sw.js', {scope:'/'});
    await navigator.serviceWorker.ready;
  }catch(e){ console.warn('SW não registrado', e); return; }

  navigator.serviceWorker.addEventListener('message', ev => {
    if(ev.data?.abrir) abrir(ev.data.abrir, '');
    else if(ev.data?.aba) trocarAba(ev.data.aba);
  });

  const inscrita = await swReg.pushManager.getSubscription();
  if(inscrita){ await enviarInscricao(inscrita); return; }
  if(Notification.permission === 'denied') return;
  if(localStorage.getItem('push_adiado') === '1') return;
  $('#faixaPush').style.display = 'flex';
}

const b64 = s => {
  const p = '='.repeat((4 - s.length % 4) % 4);
  const b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...b].map(c => c.charCodeAt(0)));
};

async function enviarInscricao(sub){
  await fetch('/api/push/inscrever',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(sub.toJSON())
  });
}

$('#ativarPush').onclick = async () => {
  $('#ativarPush').disabled = true;
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      $('#faixaPush').innerHTML = '<span>Os avisos ficaram bloqueados. Libere nas configurações do navegador para este site.</span>';
      return;
    }
    const {chave, ativo} = await fetch('/api/push/chave').then(r=>r.json());
    if(!ativo || !chave){
      $('#faixaPush').innerHTML = '<span>Os avisos ainda não foram configurados no servidor.</span>';
      return;
    }
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly:true, applicationServerKey:b64(chave)
    });
    await enviarInscricao(sub);
    $('#faixaPush').style.display='none';
    await fetch('/api/push/testar',{method:'POST'});
  }catch(e){
    console.error(e);
    $('#faixaPush').innerHTML = '<span>Não foi possível ativar os avisos neste aparelho.</span>';
  }finally{ $('#ativarPush').disabled = false; }
};

$('#fecharPush').onclick = () => {
  localStorage.setItem('push_adiado','1');
  $('#faixaPush').style.display='none';
};
